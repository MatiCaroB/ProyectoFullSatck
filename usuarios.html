<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geek&Manga</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/main.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script defer src>"js/app.js"</script>

</head>
<body>
    <header>
    
         <img width="300" height="300" src="images/logito.png" alt="logo geek&manga">
        
         <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-dold" href="index.html"> Home</a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#home"
                aria-controls="home" aria-expanded="false" aria-label="abrir home"><span class="navbar-toggler-icon"></span></button>
            
                    <div class="collapse navbar-collapse" id="home">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item"><a class="nav-link active" href="producto.html">Productos</a></li>
                            <li class="nav-item"><a class="nav-link active" href="usuarios.html">Usuarios</a></li>
                            
                        </ul>
                    </div>
            </div>
            
           
  
         </nav>
      </header>

     <section class="container">
        
        <form id="formContacto" action="#" method="post" class="bg-dark p-4 my-4 rounded shadow-sm mx-auto">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="nombre" class="form-laber text-light"> Nombre completo</label>
                    <input type="text" required id="nombre" name="nombre" class="form-control bg-dark text-light">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="correo" class="form-laber text-light"> Correo Electronico</label>
                    <input type="email" required id="correo" name="correo" class="form-control bg-dark text-light">

                </div>
                 <div class="col-md-6 mb-3">
                    <label for="telefono" class="form-laber text-light">Numero de Telefono</label>
                    <input type="tel" required id="nombre" name="nombre" class="form-control bg-dark text-light">
                </div>

            </div>

            <div class="mb-3">
                <label for="asunto" class="text-light form-label">Asunto</label>
                <select class="form-select bg-dark text-light" id="asunto">
                    <option value="contizacion">Cotización</option>
                    <option value="pedido">Pedido</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="mensaje" class="form-label text-light">Mensaje</label>
                <textarea class="form-control bg-dark text-light" id="mensaje" name="mensaje"></textarea>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input bg-dark" type="checkbox" id="terminos">
                <label class="form-check-label text-info" for="terminos">
                    Acepto ser contactado por correo :)
                </label>
            </div>

            <button id="btnEnviar" type="submit" class="btn btn-primary btn-lg">Enviar Mensaje</button>
        </form>

    </section>
</body>
</html>
