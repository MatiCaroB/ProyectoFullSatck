    <main class="container my-4">
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                <li class="breadcrumb-item active">Registrarse</li>
            </ol>
        </nav>

        <h2 class="mb-4">Crear Cuenta</h2>
        <form id="formUsuario" novalidate class="bg-dark p-4 my-4 rounded shadow-sm mx-auto border border-secondary">
            <div class="row">
                <div class="col-12 col-md-6 mb-3">
                    <label for="run" class="form-label text-light">RUN (sin puntos ni guion)</label>
                    <input type="text" id="run" name="run" maxlength="9" placeholder="Ej: 19011022K"
                        class="form-control bg-dark text-light" required>
                    <div id="error-run" class="invalid-feedback"></div>
                </div>
                <div class="col-12 col-md-6 mb-3">
                    <label for="nombre" class="form-label text-light">Nombre</label>
                    <input type="text" id="nombre" name="nombre" maxlength="50"
                        class="form-control bg-dark text-light" required>
                    <div id="error-nombre" class="invalid-feedback"></div>
                </div>
                <div class="col-12 col-md-6 mb-3">
                    <label for="apellidos" class="form-label text-light">Apellidos</label>
                    <input type="text" id="apellidos" name="apellidos" maxlength="100"
                        class="form-control bg-dark text-light" required>
                    <div id="error-apellidos" class="invalid-feedback"></div>
                </div>
                <div class="col-12 col-md-6 mb-3">
                    <label for="email" class="form-label text-light">Correo Electrónico</label>
                    <input type="email" id="email" name="email" maxlength="100"
                        class="form-control bg-dark text-light" required>
                    <div id="error-email" class="invalid-feedback"></div>
                </div>
                <div class="col-12 col-md-6 mb-3">
                    <label for="password" class="form-label text-light">Contraseña</label>
                    <input type="password" id="password" name="password" maxlength="10"
                        class="form-control bg-dark text-light" required>
                    <div id="error-password" class="invalid-feedback"></div>
                </div>
                <div class="col-12 col-md-6 mb-3">
                    <label for="confirmarPassword" class="form-label text-light">Confirmar Contraseña</label>
                    <input type="password" id="confirmarPassword" name="confirmarPassword" maxlength="10"
                        class="form-control bg-dark text-light" required>
                    <div id="error-confirmarPassword" class="invalid-feedback"></div>
                </div>
                <div class="col-12 col-md-6 mb-3">
                    <label for="fechaNacimiento" class="form-label text-light">Fecha de Nacimiento (opcional)</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento"
                        class="form-control bg-dark text-light">
                    <div id="error-fechaNacimiento" class="invalid-feedback"></div>
                </div>
                <div class="col-12 col-md-6 mb-3">
                    <label for="region" class="form-label text-light">Región</label>
                    <select id="region" name="region" class="form-select bg-dark text-light" required>
                        <option value="">-- Seleccione la región --</option>
                    </select>
                    <div id="error-region" class="invalid-feedback"></div>
                </div>
                <div class="col-12 col-md-6 mb-3">
                    <label for="comuna" class="form-label text-light">Comuna</label>
                    <select id="comuna" name="comuna" class="form-select bg-dark text-light" required disabled>
                        <option value="">-- Seleccione la comuna --</option>
                    </select>
                    <div id="error-comuna" class="invalid-feedback"></div>
                </div>
                <div class="col-12 mb-3">
                    <label for="direccion" class="form-label text-light">Dirección</label>
                    <input type="text" id="direccion" name="direccion" maxlength="300"
                        class="form-control bg-dark text-light" required>
                    <div id="error-direccion" class="invalid-feedback"></div>
                </div>
            </div>

            <button id="btnRegistrar" type="submit" class="btn btn-warning btn-lg">Registrarse</button>
            <p class="text-light mt-3 mb-0">¿Ya tienes cuenta? <a href="login.html" class="text-warning">Inicia sesión aquí</a></p>
        </form>
