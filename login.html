                aria-controls="home" aria-expanded="false" aria-label="abrir home"><span class="navbar-toggler-icon"></span></button>

                    <div class="collapse navbar-collapse" id="home">
                        <ul class="navbar-nav ms-auto align-items-lg-center">
                            <li class="nav-item"><a class="nav-link active link-pop" href="productos.html">Productos</a></li>

    <!--esto es el login de la vista tienda se supone que despues que veamos como hacerlo
    debe permitir ungresar como admin sabra dios como lo haremos-->
    <main class="container my-4">
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                <li class="breadcrumb-item active">Iniciar sesión</li>
            </ol>
        </nav>

        <div class="container-login">
            <h2 class="text-center">Inicio de sesión</h2>

            <form id="formLogin" novalidate class="bg-dark p-4 my-4 rounded shadow-sm mx-auto border border-secondary">
                <div id="alertaLogin" class="alert alert-danger d-none" role="alert"></div>

                <div class="mb-3">
                    <label for="email" class="form-label text-light">Correo</label>
                    <input type="email" id="email" name="email" maxlength="100"
                        class="form-control bg-dark text-light" required>
                    <div id="error-email" class="invalid-feedback"></div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label text-light">Contraseña</label>
                    <input type="password" id="password" name="password" maxlength="10"
                        class="form-control bg-dark text-light" required>
                    <div id="error-password" class="invalid-feedback"></div>
                </div>

                <button id="btnLogin" type="submit" class="btn btn-warning btn-lg w-100">Iniciar sesión</button>
                <p class="text-light mt-3 mb-0 text-center">¿No tienes cuenta? <a href="usuarios.html" class="text-warning">Regístrate aquí</a></p>
            </form>
        </div>
    </main>

    <footer class="bg-dark text-light text-center py-4 mt-5 ">
        <p class="mb-1">Geek&amp;Manga &copy; 2026</p>
        <a href="contacto.html" class="text-light text-decoration-none">Contacto</a>
    </footer>
</body>
