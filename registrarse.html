<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geek&Manga - Administrar usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/main.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script defer src="js/registro.js"></script>
</head>
<body class="bg-dark text-light">
    <header>
        <img width="300" height="300" src="images/logito.png" alt="logo geek&manga">

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-bold" href="Home.html">Panel Admin</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminMenu"
                aria-controls="adminMenu" aria-expanded="false" aria-label="abrir menú admin">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="adminMenu">
                    <ul class="navbar-nav ms-auto align-items-lg-center">
                        <li class="nav-item"><a class="nav-link active link-pop" href="Home.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link active link-pop" href="productoagregar.html">Productos</a></li>
                        <li class="nav-item"><a class="nav-link active link-pop" href="productomostrar.html">Listado</a></li>
                        <li class="nav-item"><a class="nav-link active link-pop" href="registrarse.html">Usuarios</a></li>
                        <li class="nav-item"><a class="nav-link active link-pop" href="index.html">Ver tienda</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-4">
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="Home.html">Home Admin</a></li>
                <li class="breadcrumb-item active text-light">Usuarios</li>
            </ol>
        </nav>

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <div>
                <h1 class="mb-1">Administración de usuarios</h1>
                <p class="text-secondary mb-0">Crear, editar y gestionar usuarios del sistema.</p>
            </div>
            
        </div>

        <div class="row g-4">
            <div class="col-lg-5">
                <form id="formAdminUsuario" class="bg-dark p-4 rounded shadow-sm border border-secondary">
                    <input type="hidden" id="usuarioId" name="usuarioId">

                    <div class="mb-3">
                        <label for="adminNombre" class="form-label text-light">Nombre</label>
                        <input type="text" id="adminNombre" class="form-control bg-dark text-light" required>
                    </div>

                    <div class="mb-3">
                        <label for="adminApellidos" class="form-label text-light">Apellidos</label>
                        <input type="text" id="adminApellidos" class="form-control bg-dark text-light" required>
                    </div>

                    <div class="mb-3">
                        <label for="adminRun" class="form-label text-light">RUN</label>
                        <input type="text" id="adminRun" class="form-control bg-dark text-light" required>
                    </div>

                    <div class="mb-3">
                        <label for="adminCorreo" class="form-label text-light">Correo</label>
                        <input type="email" id="adminCorreo" class="form-control bg-dark text-light" required>
                    </div>

                    <div class="mb-3">
                        <label for="adminPassword" class="form-label text-light">Contraseña</label>
                        <input type="password" id="adminPassword" class="form-control bg-dark text-light" required>
                    </div>

                    <div class="mb-3">
                        <label for="adminTipoUsuario" class="form-label text-light">Tipo de usuario</label>
                        <select id="adminTipoUsuario" class="form-select bg-dark text-light" required>
                            <option value="Cliente">Cliente</option>
                            <option value="Administrador">Administrador</option>
                            <option value="Vendedor">Vendedor</option>
                        </select>
                    </div>

                    <div class="d-flex gap-2 flex-wrap">
                        <button type="submit" class="btn btn-warning">Guardar usuario</button>
                        <button type="button" id="btnCancelarEdicion" class="btn btn-outline-light d-none">Cancelar</button>
                    </div>
                </form>
            </div>

            <div class="col-lg-7">
                <div class="table-responsive bg-dark rounded border border-secondary shadow-sm">
                    <table class="table table-dark table-striped align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Correo</th>
                                <th>Tipo</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="listaUsuariosAdmin"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-light text-center py-4 mt-5 border-top border-secondary">
        <p class="mb-1">Geek&amp;Manga &copy; 2026</p>
        <a href="index.html" class="text-light text-decoration-none">Volver a la tienda</a>
    </footer>
</body>
</html>
