<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geek&Manga - Carrito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/main.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script defer src="js/app.js"></script>
</head>
<body carrito>
    <header>
        <img width="300" height="300" src="images/logito.png" alt="logo geek&manga">

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="index.html">Home</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#home"
                aria-controls="home" aria-expanded="false" aria-label="abrir home">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="home">
                    <ul class="navbar-nav ms-auto align-items-lg-center">
                        <li class="nav-item"><a class="nav-link active link-pop" href="productos.html">Productos</a></li>
                        <li class="nav-item"><a class="nav-link active link-pop" href="nosotros.html">Nosotros</a></li>
                        <li class="nav-item"><a class="nav-link active link-pop" href="blogs.html">Blogs</a></li>
                        <li class="nav-item"><a class="nav-link active link-pop" href="contacto.html">Contacto</a></li>
                        <li class="nav-item"><a class="nav-link active link-pop" href="usuarios.html">Registrarse</a></li>
                        <li class="nav-item"><a class="nav-link active link-pop" href="login.html">Iniciar sesión</a></li>
                        <li class="nav-item">
                            <a class="nav-link active link-pop" href="carrito.html" id="linkCarrito">🛒 Carrito (<span id="contadorCarrito">0</span>)</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-4">
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                <li class="breadcrumb-item active">Carrito</li>
            </ol>
        </nav>

        <section class="carrito-shell">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
                <h1 class="mb-0">Mi carrito</h1>
                <button id="btnVaciarCarrito" class="btn btn-outline-dark" type="button">Vaciar carrito</button>
            </div>

            <div id="carritoLista"></div>

            <div class="carrito-total-row">
                <span>Total</span>
                <span id="carritoTotal">$0</span>
            </div>

            <div class="mt-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
                <a href="productos.html" class="btn btn-outline-dark btn-lg">Seguir comprando</a>
                <button id="btnComprar" type="button" class="btn btn-warning btn-lg">Comprar</button>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-light text-center py-4 mt-5">
        <p class="mb-1">Geek&amp;Manga &copy; 2026</p>
        <a href="contacto.html" class="text-light text-decoration-none">Contacto</a>
    </footer>
</body>
</html>
