<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geek&Manga - Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/main.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script defer src="js/app.js"></script>
    <script defer src="js/validaciones.js"></script>
    <script defer src="js/contacto.js"></script>
</head>
<body>
    <header>

        <img width="300" height="300" src="images/logito.png" alt="logo geek&manga">

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-dold" href="index.html"> Home</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#home"
                aria-controls="home" aria-expanded="false" aria-label="abrir home"><span class="navbar-toggler-icon"></span></button>

                    <div class="collapse navbar-collapse" id="home">
                        <ul class="navbar-nav ms-auto align-items-lg-center">
                            <li class="nav-item"><a class="nav-link active link-pop" href="productos.html">Productos</a></li>
                            <li class="nav-item"><a class="nav-link active link-pop" href="nosotros.html">Nosotros</a></li>
                            <li class="nav-item"><a class="nav-link active link-pop" href="blogs.html">Blogs</a></li>
                            <li class="nav-item"><a class="nav-link active link-pop" href="contacto.html">Contacto</a></li>
                            <li class="nav-item"><a class="nav-link active link-pop" href="usuarios.html">Registrarse</a></li>
                            <li class="nav-item"><a class="nav-link active link-pop" href="login.html">Iniciar sesión</a></li>
                            <li class="nav-item">
                                <a class="nav-link active link-pop" href="carrito.html" id="linkCarrito">🛒 Carrito (<span id="contadorCarrito">0</span>)</a>
                            </li>
                        </ul>
                    </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                <li class="breadcrumb-item active">Contacto</li>
            </ol>
        </nav>

        <h1 class="text-center mb-4">Contáctanos</h1>
        <p class="text-center text-muted mb-5">
            ¿Tienes dudas, sugerencias o algún problema con tu pedido? Escríbenos y te responderemos a la brevedad.
        </p>

        <form id="formContacto" novalidate class="bg-dark p-4 my-4 rounded shadow-sm mx-auto border border-secondary" style="max-width: 720px;">
            <div id="alertaContacto" class="alert d-none" role="alert"></div>

            <div class="mb-3">
                <label for="nombre" class="form-label text-light">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" maxlength="100"
                    class="form-control bg-dark text-light" required>
                <div id="error-nombre" class="invalid-feedback"></div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label text-light">Correo (opcional)</label>
                <input type="email" id="email" name="email" maxlength="100"
                    class="form-control bg-dark text-light">
                <div id="error-email" class="invalid-feedback"></div>
            </div>

            <div class="mb-3">
                <label for="comentario" class="form-label text-light">Mensaje</label>
                <textarea id="comentario" name="comentario" maxlength="500" rows="4"
                    class="form-control bg-dark text-light" required></textarea>
                <div id="error-comentario" class="invalid-feedback"></div>
            </div>

            <button id="btnEnviarContacto" type="submit" class="btn btn-warning btn-lg w-100">Enviar mensaje</button>
        </form>
    </main>

    <footer class="bg-dark text-light text-center py-4 mt-5">
        <p class="mb-1">Geek&amp;Manga &copy; 2026</p>
        <a href="contacto.html" class="text-light text-decoration-none">Contacto</a>
    </footer>
</body>
</html>
